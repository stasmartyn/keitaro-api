version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: keitaro_api_redis_dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass dev_redis_password --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - keitaro_dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_dev_data:
    driver: local

networks:
  keitaro_dev_network:
    driver: bridge
