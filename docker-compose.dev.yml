services:
    keitaro_api_ts:
        image: 857235393156.dkr.ecr.eu-central-1.amazonaws.com/keitaro_api_ts:dev
        container_name: keitaro_api_ts_dev
        restart: unless-stopped
        ports:
            - "5007:5006"
        env_file:
            - .env.dev
        networks:
            - keitaro_api_ts_dev_network
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "--spider",
                    "http://localhost:5006/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    redis:
        image: redis:7-alpine
        container_name: keitaro_api_ts_redis_dev
        restart: unless-stopped
        ports:
            - "6679:6379"
        command: redis-server --requirepass ${REDIS_PASSWORD_DEV} --appendonly yes
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD_DEV}
        volumes:
            - redis_dev_data:/data
        networks:
            - keitaro_api_ts_dev_network
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD_DEV}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    redis_dev_data:
        driver: local

networks:
    keitaro_api_ts_dev_network:
        driver: bridge
