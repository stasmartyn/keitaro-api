version: "3.8"

services:
    mongodb:
        image: mongo:6.0
        container_name: keitaro_api_mongodb
        restart: unless-stopped
        ports:
            - "27017:27017"
        command: mongod --noauth
        volumes:
            - mongodb_data:/data/db
        networks:
            - keitaro_network

    redis:
        image: redis:7-alpine
        container_name: keitaro_api_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        networks:
            - keitaro_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    mongodb_data:
        driver: local
    redis_data:
        driver: local

networks:
    keitaro_network:
        driver: bridge
